name: Auto-deployment of Documentation
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
    
    - name: Set up Python 3.
      uses: actions/setup-python@v5.6.0
      with:
        python-version: 3.10

    - name: Install Poetry.
      run: |
        pipx install poetry
        pipx inject poetry poetry-dynamic-versioning

    - name: Install locked documentation dependencies.
      run: poetry install --with docs --no-root --no-interaction
        
    - name: Build documentation.
      run: |
        mkdir gh-pages
        touch gh-pages/.nojekyll
        cd docs/
        poetry run sphinx-apidoc -o . ../kg_microbe/ --ext-autodoc -f
        poetry run sphinx-build -b html . _build
        cp -r _build/* ../gh-pages/
    
    - name: Deploy documentation.
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages
        force: true
        folder: gh-pages
