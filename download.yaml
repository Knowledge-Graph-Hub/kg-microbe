#
# **** Selective stub-import ontologies (NCIT, MESH, BTO, PO, MICRO) ****
#
# KG-Microbe does NOT load these ontologies in full. They each contribute
# thousands of unrelated nodes when fully loaded but the chemical-mapping
# consolidator and the BacDive isolation-source mapper reference only a
# tiny per-ontology footprint (~150 NCIT, ~100 MESH, a handful of BTO/PO,
# ~34 MICRO). The OntologiesStubsTransform harvests just the referenced
# IDs (label + synonyms + xrefs), emitting one labelled stub node each.
# The DBs themselves are never loaded into the merged KG.
#
# Per-source paths:
#   BTO       — OAK against the SemSQL .db (label-only; the 2 BTO stubs
#               attach via partonomic relations, not subClassOf, so MIREOT
#               yields empty modules).
#   NCIT      — OAK against the SemSQL .db with a curated multi-upper-term
#               subClassOf walk (semsql_mireot — emits hierarchy edges).
#   PO, MICRO — ROBOT MIREOT against the OWL under a curated upper_term
#               (owl_mireot — emits hierarchy edges).
#   mesh      — NLM N-Triples RDF, streamed once per run (mesh_nt_rdf —
#               emits hierarchy edges). See the entry further below.
#
# The prebuilt SemSQL DBs below are fetched from the SemanticSQL CDN
# (https://semanticsql.berkeleybop.io/<name>.db.gz), NOT the raw
# s3.amazonaws.com/bbop-sqlite bucket, whose direct public access is being
# retired (INCATools/semantic-sql#112; see kg-microbe #595). Object names are
# identical — only the host changed. The CDN sits behind a Browser Integrity
# Check that 403s default client User-Agents; kghub-downloader's HTTP-scheme
# handler already sends `User-Agent: Mozilla/5.0` (in the library's own
# download.py, not kg_microbe/download.py), so no extra header config is
# needed here.
#
# MICRO's SemSQL distribution (micro.db.gz) is a 29-byte truncated placeholder
# rather than a real SemSQL DB; PO's SemSQL .db is fine but the OWL path is the
# one the stub transform exercises for hierarchy. The MICRO and PO OWLs are
# declared above in the ontologies section.
#
-
  url: https://semanticsql.berkeleybop.io/ncit.db.gz
  local_name: ncit.db.gz
-
  url: https://semanticsql.berkeleybop.io/bto.db.gz
  local_name: bto.db.gz
-
  url: https://semanticsql.berkeleybop.io/po.db.gz
  local_name: po.db.gz

#
# MeSH (Medical Subject Headings) — full N-Triples RDF from NLM
#
# The bbop-sqlite mesh.db distribution strips relationships for C*
# supplementary concept records (79 of our 95 mesh stubs), so the stub
# transform can't reach C → D mappings from it. NLM's authoritative RDF
# does carry those mappings (via meshv:preferredMappedTo / meshv:mappedTo)
# as well as the D → D descriptor taxonomy (meshv:broaderDescriptor).
# The stub transform streams this file once per run to build the mesh
# hierarchy module.
#
-
  url: https://nlmpubs.nlm.nih.gov/projects/mesh/rdf/2026/mesh2026.nt.gz
  local_name: mesh2026.nt.gz

