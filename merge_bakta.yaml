# GENERATED from merge.yaml + config/merge_variants.yaml; do not edit directly.
# Standard graph plus Bakta, COG, and KEGG genome annotations.
configuration:
  output_directory: data/merged
  checkpoint: false
  category_allowlist:
  - METPO:1004005
  curie_map: null
  node_properties: null
  predicate_mappings: null
  property_types: null
  preserve:
  - primary_knowledge_source
