[tool.poetry]
name = "kg-microbe"
version = "0.0.0"
description = "kg-microbe"
authors = ["Harshad Hegde <hhegde@lbl.gov>"]
license = "BSD-3-Clause"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
click = "*"
importlib-metadata = "^6.8.0"
kghub-downloader = "^0.3.7"
kgx = "^2.4.0"
koza = "*"
biolink-model = "4.4.2"
watchdog = "<4.0.0" # ! This is a temporary fix 4.0.0 breaks on GH Actions
# ! Below 0.7.2 OAK resolves `sqlite:obo:` against https://s3.amazonaws.com/bbop-sqlite, which is retired and
# ! answers 403; 0.7.2 moved the default to https://semanticsql.berkeleybop.io (oaklib#897, semantic-sql#110).
# ! >=0.7.3 matches the KG-Microbe Mechs. 0.7.4 also drops 0.7.3's `linkml==1.10.0` exact pin.
oaklib = ">=0.7.3"
requests-cache = "^1.1.0"
# ! oaklib >=0.7.3 requires llm >=0.14,<1. Nothing here imports llm directly; it is only reached through OAK's
# ! `llm:` selector in kg_microbe/utils/ner_utils.py.
llm = ">=0.14,<1"
pyobo = ">=0.12.0"
curies = ">=0.8.0"
biopython = "^1.83"
matplotlib = ">=3.7"
toytree = "^3.0"
bacdive = "*"
python-dotenv = "*"
requests-ftp = "^0.3"
pandas = ">=2.0.0"
psutil = "^5.9.0"
duckdb = "^1.5.1"
setuptools = "<81" # ! Keep pkg_resources available for eutils (via oaklib); removed in setuptools 81
lpsn = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.1.2"
tox = ">=3.25.1"
pre-commit = ">=3.3.3"
parameterized = "^0.8.1"
notebook = "^7.0.6"
jupyter-contrib-nbextensions = "^0.7.0"
python-sql = "^1.4.2"
ipython-sql = "^0.5.0"
ruff = ">=0.2.1"
deptry = ">=0.16.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = {version = ">=6.1.3"}
sphinx-rtd-theme = {version = ">=1.0.0"}
sphinx-autodoc-typehints = ">=1.24,<4.0"
sphinx-click = {version = ">=4.3.0"}
myst-parser = {version = ">=0.18.1"}


[tool.poetry.group.s3.dependencies]
boto3 = "^1.34.37"
aws = "^0.2.5"

[tool.poetry.scripts]
kg = 'kg_microbe.run:main'

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-ignore = [
    "D211",  # `no-blank-line-before-class`
    "D212",  # `multi-line-summary-first-line`
    # D203 and the formatter disagree, and `tox -e format` runs both in sequence:
    # `ruff format` strips the blank line before a class docstring, then
    # `ruff check --fix` puts it back. Net zero, exit 0 — so the format env has
    # been a silent no-op, and `ruff format --check` has reported ~98 files
    # unformatted indefinitely because the fix can never stick. Ruff warns about
    # exactly this pairing on every run. D211 (its mutually exclusive opposite)
    # is already ignored above, so ignoring D203 leaves the formatter to decide,
    # which is the only self-consistent option (#874).
    "D203",  # `one-blank-line-before-class` — conflicts with `ruff format`
    "S301",  # `pickle` and modules that wrap it can be unsafe when used to deserialize untrusted data, possible security issue`
    "S605",  # Starting a process with a shell, possible injection detected
    "S202",  # Uses of `tarfile.extractall()` - needed for KGX merge workflow
    ]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Select or ignore from https://beta.ruff.rs/docs/rules/
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "S",  # flake8-bandit
    "W",  # Warning
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in test files
"kg_microbe/query_utils/*" = ["S608"]  # DuckDB queries use database CURIEs, not user input
# scripts/ entered the lint gate with 405 findings (#950). The three that could
# bite were fixed outright -- two undefined names and an f-string that was a
# SyntaxError on 3.10 and 3.11 -- and 274 more were auto-fixed. What remains is
# style and bandit noise, grandfathered PER FILE rather than for the directory:
# the other 18 scripts are already clean and stay strict, and so does every new
# one (#968). Each entry disappears when its file is cleaned; do not add to the
# list, and `tests/test_scripts_lint_debt.py` fails if an entry stops firing.
"scripts/analyze_custom_metpo_mappings.py" = ["D401", "E501"]
"scripts/analyze_gtdb_metatraits_overlap.py" = ["D401", "E501"]
"scripts/consolidate_chemical_mappings.py" = ["B023", "D205", "D401", "E501", "S110", "S603", "S607"]
"scripts/download_kegg_bulk.py" = ["D401"]
"scripts/download_kegg_minimal.py" = ["D401"]
"scripts/examples/visualization/create_1hop_full_labels.py" = ["D100", "D400", "D415", "E501"]
"scripts/examples/visualization/create_1hop_subgraph.py" = ["D100", "D103", "D400", "D415", "E501"]
"scripts/examples/visualization/create_2hop_full_labels.py" = ["D100", "D400", "D415"]
"scripts/examples/visualization/create_full_label_visualizations.py" = ["D100", "D103", "D400", "D415", "E501"]
"scripts/extract_metpo_proposals.py" = ["E501", "S603", "S607"]
"scripts/mediadive_coverage_check.py" = ["E501"]
"scripts/prego_validation/build_assay_gold.py" = ["S108"]
"scripts/prego_validation/build_uniprot_gold.py" = ["D103", "E701", "E702", "S108"]
"scripts/prego_validation/fold_enrichment_go.py" = ["E701", "E702", "S108"]
"scripts/prego_validation/precision_assay_go.py" = ["D400", "E701", "E702", "S108"]
"scripts/prego_validation/predicate_interaction.py" = ["D400", "E501", "S108", "S311"]
"scripts/validate_knowledge_sources.py" = ["E501"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
# Configure known first-party modules for correct import sorting.
# `run` is the repo-root CLI module (run.py); declaring it explicitly keeps
# isort classification deterministic in CI, where filesystem-based first-party
# detection does not pick it up.
known-first-party = ["kg_microbe", "run"]

[tool.pytest.ini_options]
norecursedirs = ["scripts", "notebooks", "docs", ".git"]
markers = [
    "integration: tests that require external services, network access, or large data",
]

[tool.deptry]
extend_exclude = ["notebooks", "docs"]

[tool.codespell]
skip = "*.po,*.ts,.git,pyproject.toml"
count = ""
quiet-level = 3
ignore-words-list = "NiFe,formate"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
