# Local validation runs the suite once in Poetry's selected Python environment.
# CI selects each supported Python version separately. See docs/TESTING.md.

[tox]
# To use a PEP 517 build-backend you are required to configure tox to use an isolated_build:
# https://tox.readthedocs.io/en/latest/example/package.html
isolated_build = True
skipsdist = True

envlist =
    # always keep coverage-clean first
    coverage-clean
    format-check
    lint
    codespell
    docstr-coverage
    py

[testenv]
allowlist_externals =
    poetry
commands =
    poetry run pytest {posargs}
description = Run unit tests with pytest. This is a special environment that does not get a name, and
              can be referenced with "py".

[testenv:coverage-clean]
deps = coverage
skip_install = true
commands = coverage erase

# This is used during development
# Run auto-fixes explicitly, review them, and commit before final validation.
[testenv:format]
deps =
    ruff
skip_install = true
commands =
    ruff format kg_microbe/ tests/
# scripts/ is linted and spell-checked (see [testenv:lint] and [testenv:codespell])
# but deliberately not formatted yet: `ruff format` over its ~8,500 lines would
# be a diff reviewable only as noise. Adopting the formatter there is its own
# change; see #950.
    ruff check --fix kg_microbe/ tests/
description = Run formatters and auto-fix lints.

[testenv:format-check]
deps =
    ruff
skip_install = true
commands =
    ruff format --check kg_microbe/ tests/
description = Check formatting without changing the candidate being validated.

# This is used for QC checks.
[testenv:lint]
deps =
    ruff
skip_install = true
commands =
    ruff check kg_microbe/ tests/ scripts/
description = Run linters.

[testenv:doclint]
deps =
    rstfmt
skip_install = true
commands =
    rstfmt docs/source/
description = Run documentation linters.

[testenv:codespell]
description = Run spell checker.
skip_install = true
deps =
    codespell
    tomli  # required for getting config from pyproject.toml
commands = codespell kg_microbe/ tests/ scripts/ \
            -S kg_microbe/transform_utils/*/tmp/* \
            -S kg_microbe/transform_utils/bacdive/metabolite_mapping.json \
            -S kg_microbe/transform_utils/ontologies/xrefs/* \
            -S kg_microbe/transform_utils/ontology/xrefs/* \
            -S kg_microbe/transform_utils/data/* \
            -S kg_microbe/transform_utils/bactotraits/BactoTraits.tsv \
            -S tests/resources/traits/* \
            -S tests/resources/nlp/stopwords/stopWords.txt \
            -S tests/resources/bacdive/* \
            -S tests/resources/raw/* \
            -S 'tests/resources/ingredient_bundle/native/*' \
            -S tests/resources/uberon_temporal_categories/uberon.json \
            -S tests/resources/finite_import_categories/native/foodon.json \
            -S tests/resources/finite_import_categories/native/uberon.json \
            -S tests/resources/finite_import_categories/native/pato.json \
            -S tests/resources/finite_import_categories/native/envo.json \
            -S tests/resources/native_ro_retention/pato.json \
            -S tests/resources/native_ro_retention/uberon.json \
            -S tests/resources/native_ro_retention/ro.json \
            -S tests/resources/native_ro_retention/envo.json \
            -S tests/resources/native_ro_retention/mondo.json \
            -S tests/resources/native_ro_retention/temporal62_native.json \
            -S tests/resources/go_subject_restrictions/pato.owl \
            -S tests/resources/foodon_kernel/foodon.json \
            -S tests/resources/foodon_kernel/foodon.owl \
            -S tests/resources/bacdive_ncit_category_claims/records.json \
            -S tests/resources/bacdive_agriculture_approved.json \
            -S tests/resources/bacdive_supplied_taxid_approved.json \
            -S tests/resources/bacdive_fallback/additional_unresolved.json \
            -S tests/resources/bacdive_fallback/native_compatibility.json \
            -S tests/resources/bacdive_fallback/records.json \
            -S tests/resources/ontology_parent_dispositions/foodon.json \
            -S tests/resources/ontology_parent_dispositions/foodon.owl \
            -S tests/resources/ontology_parent_dispositions/lifecycle/foodon.json \
            -S tests/resources/ontology_parent_dispositions/lifecycle/po.owl \
            -S tests/resources/finite_envo_po/envo.json \
            -S tests/resources/finite_envo_po/po.owl \
            -S tests/resources/mesh_finite_categories/mesh2026-core-excerpt.nt \
            -S tests/resources/ncit_eight_categories/native.json \
            -S tests/resources/ncit_eight_categories/extension_incident_edges.json \
            -S tests/resources/gold_selected_taxon_aliases/native_evidence.json \
            -S tests/resources/gold_taxonomy/fold_native_contexts.json \
            -S 'tests/resources/participation_disposition/*.json' \
            -S 'tests/resources/foodon_taxon_constraints/claims.json,tests/resources/foodon_taxon_constraints/native.json,tests/resources/foodon_taxon_constraints/owl.json' \
            -S tests/resources/mediadive_recipe_identity/raw/mediadive/media_detailed.json \
            -S tests/resources/mediadive_recipe_identity/raw/mediadive/media_strains.json \
            -S tests/resources/mediadive_recipe_identity/raw/mediadive/solutions.json \
            -S 'kg_microbe/utils/bacdive*.json*' \
            -S 'scripts/examples/visualization/*.csv'

